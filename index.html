<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Tyrant Guild Map</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

#container{
    display:flex;
    gap:20px;
    align-items:flex-start;
}

#viewport{
    width:800px;
    height:800px;
    overflow:hidden;
    border:2px solid black;
    position:relative;
    cursor:crosshair;
}

#map{
    position:absolute;
    width:750px;
    height:750px;
    background-image:
        linear-gradient(to right, #ddd 1px, transparent 1px),
        linear-gradient(to bottom, #ddd 1px, transparent 1px);
    background-size:30px 30px;
    transform-origin:0 0;
}

.guild{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid white;
    cursor:pointer;
    box-sizing:border-box;
    transition:all 0.15s ease;
}

.guild:hover{
    transform:scale(1.25);
}

.guild.selected{
    box-shadow:
        0 0 0 3px white,
        0 0 12px 4px rgba(255,255,255,0.9);
    z-index:1000;
}

.label{
    position:absolute;
    font-size:12px;
    color:#666;
    pointer-events:none;
}

#sidebar{
    width:320px;
}

.panel{
    border:1px solid #ccc;
    border-radius:8px;
    padding:15px;
    margin-bottom:15px;
}

#searchBox{
    width:180px;
    padding:6px;
}

button{
    padding:6px 10px;
}
</style>

</head>

<body>

<h2>Tyrant Guild Map</h2>

<div id="container">

<div id="viewport">
    <div id="map"></div>
</div>

<div id="sidebar">

```
<div class="panel">
    <h3>Search Guild</h3>

    <input
        id="searchBox"
        type="text"
        placeholder="Guild name or tag">

    <button onclick="searchGuild()">
        Search
    </button>

    <div id="searchResult"></div>
</div>

<div class="panel">
    <h3>Map Info</h3>
    <div id="coords">X: -, Y: -</div>
    <div id="zoom">Zoom: 100%</div>
    <div id="status">Loading guilds...</div>
</div>

<div class="panel" id="info">
    <h3>No guild selected</h3>
    Click a guild marker.
</div>
```

</div>

</div>

<script>

const CSV_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vT5lyYvujRZ3Wn0nR_4P51h4q3XC8RxM7g3UBTsuQbKHp8z7xQYR4VD-51OVqrEjy2tVxxb33e8ZPAn/pub?gid=0&single=true&output=csv';

const pixelSize = 750;
const scaleFactor = pixelSize / 250;

const map = document.getElementById("map");

let selectedGuildMarker = null;
let guildData = [];

let zoom = 1;
let offsetX = 0;
let offsetY = 0;

for(let i = 0; i <= 250; i += 50){

    const xLabel = document.createElement("div");
    xLabel.className = "label";
    xLabel.innerText = i;
    xLabel.style.left = (i * scaleFactor - 10) + "px";
    xLabel.style.top = "730px";
    map.appendChild(xLabel);

    const yLabel = document.createElement("div");
    yLabel.className = "label";
    yLabel.innerText = i;
    yLabel.style.left = "5px";
    yLabel.style.top = (i * scaleFactor - 8) + "px";
    map.appendChild(yLabel);
}

function updateTransform(){

    map.style.transform =
        `translate(${offsetX}px, ${offsetY}px) scale(${zoom})`;

    document.getElementById("zoom").innerText =
        `Zoom: ${Math.round(zoom * 100)}%`;
}

function selectGuild(g, marker){

    if(selectedGuildMarker){
        selectedGuildMarker.classList.remove("selected");
    }

    marker.classList.add("selected");
    selectedGuildMarker = marker;

    document.getElementById("info").innerHTML = `
        <h3>[${g.tag}] ${g.name}</h3>
        <p><b>Coordinates:</b> (${g.x}, ${g.y})</p>
        <p><b>Color:</b> ${g.color}</p>
    `;
}

function addGuild(g){

    const marker = document.createElement("div");

    marker.className = "guild";
    marker.style.background = g.color;

    marker.style.left =
        (g.x * scaleFactor - 9) + "px";

    marker.style.top =
        (g.y * scaleFactor - 9) + "px";

    marker.title =
        `[${g.tag}] ${g.name}`;

    marker.onclick = () => {
        selectGuild(g, marker);
    };

    g.marker = marker;

    guildData.push(g);

    map.appendChild(marker);
}

async function loadGuilds(){

    try{

        const response = await fetch(CSV_URL);
        const csv = await response.text();

        const rows =
            csv
            .replace(/\r/g,'')
            .trim()
            .split('\n');

        let loaded = 0;
        let skipped = 0;

        for(let i=1;i<rows.length;i++){

            const cols = rows[i]
                .split(',')
                .map(v => v.trim());

            if(cols.length < 5){
                skipped++;
                continue;
            }

            const tag = cols[0];
            const name = cols[1];
            const x = Number(cols[2]);
            const y = Number(cols[3]);
            const color = cols[4];

            if(
                Number.isNaN(x) ||
                Number.isNaN(y)
            ){
                skipped++;
                continue;
            }

            addGuild({
                tag,
                name,
                x,
                y,
                color
            });

            loaded++;
        }

        document.getElementById("status").innerText =
            `${loaded} guild(s) loaded`;

        if(skipped > 0){

            document.getElementById("status").innerText +=
                ` (${skipped} skipped)`;
        }

    }
    catch(error){

        console.error(error);

        document.getElementById("status").innerText =
            "Failed to load Google Sheet";
    }
}

function searchGuild(){

    const search =
        document.getElementById("searchBox")
        .value
        .trim()
        .toLowerCase();

    const guild =
        guildData.find(g =>
            g.tag.toLowerCase() === search ||
            g.name.toLowerCase() === search
        );

    if(!guild){

        document.getElementById("searchResult")
            .innerText = "Guild not found";

        return;
    }

    document.getElementById("searchResult")
        .innerText = "";

    selectGuild(guild, guild.marker);

    zoom = 2;

    offsetX =
        400 - (guild.x * scaleFactor * zoom);

    offsetY =
        400 - (guild.y * scaleFactor * zoom);

    updateTransform();
}

document
.getElementById("searchBox")
.addEventListener("keydown", e => {

    if(e.key === "Enter"){
        searchGuild();
    }

});

loadGuilds();

const viewport = document.getElementById("viewport");

viewport.addEventListener("wheel",(e)=>{

    e.preventDefault();

    const rect = viewport.getBoundingClientRect();

    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const worldX = (mouseX - offsetX) / zoom;
    const worldY = (mouseY - offsetY) / zoom;

    if(e.deltaY < 0){
        zoom *= 1.1;
    }
    else{
        zoom /= 1.1;
    }

    zoom = Math.max(0.5, Math.min(5, zoom));

    offsetX = mouseX - worldX * zoom;
    offsetY = mouseY - worldY * zoom;

    updateTransform();
});

let dragging = false;
let startX;
let startY;

viewport.addEventListener("mousedown",(e)=>{

    dragging = true;

    startX = e.clientX - offsetX;
    startY = e.clientY - offsetY;
});

window.addEventListener("mouseup",()=>{
    dragging = false;
});

window.addEventListener("mousemove",(e)=>{

    if(dragging){

        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;

        updateTransform();
    }
});

viewport.addEventListener("mousemove",(e)=>{

    const rect = viewport.getBoundingClientRect();

    const px =
        (e.clientX - rect.left - offsetX) / zoom;

    const py =
        (e.clientY - rect.top - offsetY) / zoom;

    let mapX =
        Math.round(px / scaleFactor);

    let mapY =
        Math.round(py / scaleFactor);

    mapX = Math.max(0, Math.min(250, mapX));
    mapY = Math.max(0, Math.min(250, mapY));

    document.getElementById("coords").innerText =
        `X: ${mapX}, Y: ${mapY}`;
});

updateTransform();

</script>

</body>
</html>
